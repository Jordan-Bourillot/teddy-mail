[package]
name = "teddy-mail-shell"
version = "0.5.1"
edition = "2021"
description = "Teddy Mail desktop shell"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-os = "2.0"
tauri-plugin-updater = "2.0"
tauri-plugin-process = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
once_cell = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

# V0.5.0: rust-core compiles cleanly and is now linked into the shell.
# The IMAP IDLE worker, MIME parser, encrypted SQLCipher store, OAuth helpers
# and SMTP layer are reachable from commands.rs::parse_raw and the Store APIs.
# UI wiring of real account creation + sync trigger lands in V0.6.
teddy_mail_core = { path = "../rust-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
