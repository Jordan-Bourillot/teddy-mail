<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd6e0"/>
      <stop offset="100%" stop-color="#ff8fa3"/>
    </linearGradient>
    <radialGradient id="fur" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#fafaf6"/>
      <stop offset="100%" stop-color="#ece8de"/>
    </radialGradient>
    <radialGradient id="innerEar" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#fcc5cd"/>
      <stop offset="100%" stop-color="#f49aa7"/>
    </radialGradient>
    <radialGradient id="lens" cx="32%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#ffd0db" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fb9bb0" stop-opacity="0.15"/>
    </radialGradient>
    <radialGradient id="snout" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffaf3"/>
      <stop offset="100%" stop-color="#f7eee0"/>
    </radialGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="1024" height="1024" rx="200" fill="url(#bg)"/>

  <!-- Soft ground shadow -->
  <ellipse cx="512" cy="920" rx="290" ry="22" fill="#000" fill-opacity="0.08"/>

  <!-- Ears -->
  <g>
    <circle cx="288" cy="296" r="128" fill="url(#fur)" stroke="#dcd6c5" stroke-width="2"/>
    <circle cx="288" cy="296" r="68" fill="url(#innerEar)"/>
    <circle cx="736" cy="296" r="128" fill="url(#fur)" stroke="#dcd6c5" stroke-width="2"/>
    <circle cx="736" cy="296" r="68" fill="url(#innerEar)"/>
  </g>

  <!-- Head -->
  <circle cx="512" cy="552" r="332" fill="url(#fur)" stroke="#dcd6c5" stroke-width="2"/>

  <!-- Snout -->
  <ellipse cx="512" cy="688" rx="156" ry="128" fill="url(#snout)"/>

  <!-- Glasses lenses (subtle pink tint) -->
  <circle cx="392" cy="510" r="98" fill="url(#lens)"/>
  <circle cx="632" cy="510" r="98" fill="url(#lens)"/>

  <!-- Eyes behind glasses -->
  <circle cx="392" cy="515" r="17" fill="#1a1a1a"/>
  <circle cx="398" cy="509" r="6" fill="#ffffff"/>
  <circle cx="632" cy="515" r="17" fill="#1a1a1a"/>
  <circle cx="638" cy="509" r="6" fill="#ffffff"/>

  <!-- Glasses frames + bridge + temple arms -->
  <g fill="none" stroke="#ec4899" stroke-width="22" stroke-linecap="round">
    <circle cx="392" cy="510" r="98"/>
    <circle cx="632" cy="510" r="98"/>
    <line x1="490" y1="510" x2="534" y2="510"/>
    <line x1="294" y1="510" x2="232" y2="528"/>
    <line x1="730" y1="510" x2="792" y2="528"/>
  </g>

  <!-- Glasses highlight (give them a glossy feel) -->
  <path d="M 348 458 q 24 -24 60 -16" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>
  <path d="M 588 458 q 24 -24 60 -16" fill="none" stroke="#fbcfe8" stroke-width="6" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="512" cy="650" rx="42" ry="32" fill="#1a1a1a"/>
  <ellipse cx="503" cy="642" rx="10" ry="7" fill="#3d3d3d"/>

  <!-- Philtrum + mouth -->
  <path d="M 512 678 L 512 712" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <path d="M 466 728 Q 512 758 558 728" stroke="#1a1a1a" stroke-width="9" fill="none" stroke-linecap="round"/>

  <!-- Subtle blush below cheeks -->
  <ellipse cx="316" cy="660" rx="46" ry="22" fill="#f9a8b4" fill-opacity="0.55"/>
  <ellipse cx="708" cy="660" rx="46" ry="22" fill="#f9a8b4" fill-opacity="0.55"/>
</svg>
