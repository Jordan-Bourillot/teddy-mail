[package]
name = "pite-lafe-mail-shell"
version = "0.1.0"
edition = "2021"
description = "Pite Lafe Mail desktop shell"
license = "MIT OR Apache-2.0"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-os = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.40", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
once_cell = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2"
chrono = { version = "0.4", features = ["serde"] }

# V0.1.0: ship the desktop shell with the React UI; mail backend integration
# (rust-core) lands in V0.2 once API drift in async-imap/lettre/mail-parser is
# resolved. The shell still runs the full UI with mock IPC fallback.
# pite_lafe_core = { path = "../rust-core" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
