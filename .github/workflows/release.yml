name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libsqlcipher-dev patchelf

      - run: npm ci

      - name: Generate icons
        run: node scripts/generate_icons.mjs

      - name: Tauri build (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build -- --target ${{ matrix.target }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: teddy-mail-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*-setup.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
          retention-days: 7

  release:
    name: Publish GitHub release + updater manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Build latest.json updater manifest
        id: manifest
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          PUB_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          read_sig() {
            local f="$1"
            [ -f "$f" ] && cat "$f" || echo ""
          }

          NSIS_EXE=$(find artifacts -name "*-setup.exe" | head -1)
          NSIS_SIG=$(read_sig "$NSIS_EXE.sig")
          NSIS_URL="https://github.com/Jordan-Bourillot/teddy-mail/releases/download/${TAG}/$(basename "$NSIS_EXE" | sed 's/ /./g')"

          DMG=$(find artifacts -name "*.dmg" | head -1)
          DMG_SIG=$(read_sig "$DMG.sig")

          APPIMG=$(find artifacts -name "*.AppImage" | head -1)
          APPIMG_SIG=$(read_sig "$APPIMG.sig")
          APPIMG_URL="https://github.com/Jordan-Bourillot/teddy-mail/releases/download/${TAG}/$(basename "$APPIMG" | sed 's/ /./g')"

          cat > latest.json <<EOF
          {
            "version": "${VERSION}",
            "pub_date": "${PUB_DATE}",
            "notes": "See release notes on GitHub.",
            "platforms": {
              "windows-x86_64": {
                "signature": "${NSIS_SIG}",
                "url": "${NSIS_URL}"
              },
              "linux-x86_64": {
                "signature": "${APPIMG_SIG}",
                "url": "${APPIMG_URL}"
              }
            }
          }
          EOF
          cat latest.json

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            latest.json
            artifacts/**/*-setup.exe
            artifacts/**/*.msi
            artifacts/**/*.dmg
            artifacts/**/*.AppImage
            artifacts/**/*.deb
