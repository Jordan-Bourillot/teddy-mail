[package]
name = "pite_lafe_core"
version = "0.1.0"
edition = "2021"
description = "Pite Lafe Mail core: IMAP/JMAP sync, encrypted store, MIME parsing"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"
async-imap = "0.10"
async-native-tls = "0.5"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1-native-tls", "builder"] }
mail-parser = "0.10"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
keyring = "3"
oauth2 = "4"
url = "2"
anyhow = "1"
once_cell = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"
proptest = "1"
mockall = "0.13"
tempfile = "3"
